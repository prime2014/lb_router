<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Xpress</title>
  <desc id="d">Xpress, a Go load balancer and reverse proxy. A client connects to Xpress, which fans traffic out to three backend servers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f2a"/>
      <stop offset="1" stop-color="#103447"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ADD8"/>
      <stop offset="1" stop-color="#5DC9E2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5DC9E2"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect x="0" y="300" width="1200" height="20" fill="url(#accent)" opacity="0.9"/>

  <!-- Title block -->
  <text x="60" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#ffffff" letter-spacing="2">Xpress</text>
  <rect x="64" y="162" width="120" height="6" rx="3" fill="url(#accent)"/>
  <text x="62" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#cfe9f2">Load balancer &amp; reverse proxy</text>
  <text x="62" y="245" font-family="Consolas, Menlo, monospace" font-size="20" fill="#5DC9E2">written in Go  ·  HTTP + TCP  ·  PROXY v2</text>

  <!-- Diagram -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">
    <!-- client -->
    <circle cx="650" cy="150" r="30" fill="none" stroke="#5DC9E2" stroke-width="3"/>
    <text x="650" y="157">C</text>
    <text x="650" y="205" font-size="15" fill="#9fc7d4">clients</text>

    <!-- xpress -->
    <rect x="760" y="115" width="110" height="70" rx="14" fill="#00ADD8"/>
    <text x="815" y="157" font-weight="700" fill="#0b1f2a" font-size="22">Xpress</text>

    <!-- backends -->
    <rect x="990" y="50" width="150" height="46" rx="10" fill="#0e2a38" stroke="#5DC9E2" stroke-width="2"/>
    <text x="1065" y="80">backend A</text>
    <rect x="990" y="127" width="150" height="46" rx="10" fill="#0e2a38" stroke="#5DC9E2" stroke-width="2"/>
    <text x="1065" y="157">backend B</text>
    <rect x="990" y="204" width="150" height="46" rx="10" fill="#0e2a38" stroke="#5DC9E2" stroke-width="2"/>
    <text x="1065" y="234">backend C</text>
  </g>

  <!-- connectors -->
  <g stroke="#5DC9E2" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="682" y1="150" x2="754" y2="150"/>
    <path d="M870 135 C 930 135, 930 73, 984 73"/>
    <line x1="870" y1="150" x2="984" y2="150"/>
    <path d="M870 165 C 930 165, 930 227, 984 227"/>
  </g>

  <text x="930" y="285" font-family="Consolas, Menlo, monospace" font-size="15" fill="#9fc7d4" text-anchor="middle">round_robin · ip_hash · consistent_hash</text>
</svg>
