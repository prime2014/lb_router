#------------------------------------------------------------------------------------------------------------#
#                      THIS IS THE PRIMARY CONFIGURATION FILE FOR THE LOAD BALANCER                          #
#------------------------------------------------------------------------------------------------------------#
# you can store it in a different location but ensure you enable permissions for it. Otherwise
# the application will fail to read it.

# if in a different location ensure you pass it in the cli
#  xpress start -c 

# The parameters in this file have been exhaustively added,
# so it is recommended not to add anything more other than
# what has already been detailed.

server:
  # The ip address of the host server of the load balancer
  listener: "127.0.0.1"
  # The domain name that the host server uses for name resolution
  server_name: ""
  # Port connection
  port: "8080"
  # ssl certificate path location
  certFile: ""
  # ssl key file path location
  certKey: ""

router:
  # The protocol mode that the host server listens for
  mode: "http" # mode -> http | https | tcp
  # The load balancing algorithm to use
  algorithm: "round_robin"
  # a list of urls for the downstream servers
  urls:
    - "https://jsonplaceholder.typicode.com/"

logs:
  # default path to the log files
  path: /var/logs/xpress/
  level: info